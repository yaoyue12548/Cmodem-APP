name: iOS IPA and Release

on:
  workflow_dispatch:
  push:
    branches: ["main", "ios-port"]
    paths:
      - "ios/**"
      - "app/src/main/assets/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project FHCpeBoard.xcodeproj -scheme FHCpeBoard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/FHCpeBoard.app build/Payload/
          app=build/Payload/FHCpeBoard.app
          widget="$app/PlugIns/CmodemWidget.appex"
          test -x "$widget/CmodemWidget"
          test -s "$app/native-board.js" && test -s "$app/native-sample.js"
          test -s "$app/assets/air6_ui.js"
          test "$(plutil -extract NSExtension.NSExtensionPointIdentifier raw "$widget/Info.plist")" = "com.apple.widgetkit-extension"
          for key in CFBundleVersion CFBundleShortVersionString; do
            test "$(plutil -extract "$key" raw "$app/Info.plist")" = "$(plutil -extract "$key" raw "$widget/Info.plist")"
          done
          cd build && zip -r FHCpeBoard-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FHCpeBoard-unsigned-IPA
          path: build/FHCpeBoard-unsigned.ipa
      - name: Publish GitHub prerelease
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-v1.4.3-${{ github.run_number }}
          name: Cmodem iOS 1.4.3 build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: |
            macOS GitHub Actions build for the iOS port.

            The IPA is unsigned. Sign the embedded CmodemWidget extension and the containing app with profiles for their respective bundle IDs. Enable group.com.fhcpeboard.ios for both targets so the widget can read dashboard samples.
          files: build/FHCpeBoard-unsigned.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
