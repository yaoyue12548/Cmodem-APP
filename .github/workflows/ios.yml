name: iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main", "ios-port"]
    paths:
      - "ios/**"
      - "app/src/main/assets/**"
      - "project.yml"
      - ".github/workflows/ios.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build unsigned app
        run: xcodebuild -project FHCpeBoard.xcodeproj -scheme FHCpeBoard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/FHCpeBoard.app build/Payload/
          cd build && zip -r FHCpeBoard-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FHCpeBoard-unsigned-IPA
          path: build/FHCpeBoard-unsigned.ipa
