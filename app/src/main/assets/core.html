<!doctype html><html><head><meta charset="utf-8"><title>FHCpeBoard LAN Core</title></head><body>
<script>
'use strict';
// iOS supplies the same synchronous storage/asset surface as the Android bridge.
if (!window.AndroidCore && window.webkit?.messageHandlers?.core) {
  const native = window.webkit.messageHandlers.core;
  const secure = window.__iosKeychain || (window.__iosKeychain = {});
  const preferences = window.__iosPreferences || (window.__iosPreferences = {});
  const values = new Proxy(preferences, {
    get: (target, key) => typeof key === 'string' && Object.prototype.hasOwnProperty.call(secure, key) ? secure[key] : target[key],
    set: (target, key, value) => { target[key] = String(value); return true; },
    deleteProperty: (target, key) => { delete target[key]; return true; }
  });
  const assets = window.__iosAssets || {};
  window.AndroidCore = {
    kcGet: key => values[key] || '',
    kcSet: (key, value) => { if(secureKey(key))secure[key]=String(value);else preferences[key]=String(value); native.postMessage({action:secureKey(key)?'keychainSet':'preferenceSet', key, value:String(value)}); },
    kcRemove: key => { delete secure[key];delete preferences[key];native.postMessage({action:secureKey(key)?'keychainRemove':'preferenceRemove', key}); },
    kcContains: key => Object.prototype.hasOwnProperty.call(values, key),
    clearCaches: () => { for (const key of Object.keys(values)) if (/CACHE|CACHED_DATA/.test(key)) delete values[key]; native.postMessage({action:'clearCaches'}); return 0; },
    assetRead: name => assets[name] || '',
    fileDocsDir: () => 'Documents', fileExists: () => false, fileRead: () => '', fileWrite: () => {}, fileRemove: () => {},
    stringify: value => value, parse: value => value, themeDark: () => matchMedia('(prefers-color-scheme: dark)').matches,
    nativePing: () => JSON.stringify({ok:true,ver:'1.4.3-local-52',nativeCore:false}),
    decodeSmsPdu: pdu => window.__iosPduDecoded?.[pdu] || '',
    fetch: (id, url, options) => native.postMessage({action:'fetch', id, url, options}),
    clearHttpSession: url => native.postMessage({action:'clearHttpSession', url}),
    evalJS: (id, js) => native.postMessage({action:'evalJS', id, js}),
    loadHTML: (id, html) => native.postMessage({action:'loadHTML', id, html}),
    reseed: () => 'ok'
  };
  window.AndroidBoard = {
    uiFlavor: () => 'default',
    wifiCacheGet: scope => values['UPSTREAM_LOCAL_WIFI_CACHE_' + scope] || '',
    wifiCacheSet: (scope, value) => { values['UPSTREAM_LOCAL_WIFI_CACHE_' + scope] = value; native.postMessage({action:'keychainSet',key:'UPSTREAM_LOCAL_WIFI_CACHE_'+scope,value}); },
    postMessage: json => native.postMessage({action:'pageMessage', json})
  };
  function secureKey(key) { return key === 'LAN_PROFILES_V1' || key.startsWith('UPSTREAM_LOCAL_') || key.startsWith('LAN_DEVICE_NAME_OVERRIDE_'); }
}
let sequence = 0;
const pending = new Map();
function nativeCall(kind, invoke, timeout) {
  const id = kind + (++sequence);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(id); reject(Error('设备请求超时')); }, timeout || 60000);
    pending.set(id, {resolve:v=>{clearTimeout(timer);resolve(v);}, reject:e=>{clearTimeout(timer);reject(e);}});
    try { invoke(id); } catch(e) { clearTimeout(timer); pending.delete(id); reject(e); }
  });
}
window.__fetchDoneFile = (id,status,path) => {
  const rec=pending.get(id); if(!rec){AndroidCore.fileRemove(path);return;} pending.delete(id);
  try{rec.resolve({status,text:AndroidCore.fileRead(path)});}catch(e){rec.reject(e);}finally{AndroidCore.fileRemove(path);}
};
window.__fetchText = (id,status,text) => {const r=pending.get(id);if(r){pending.delete(id);r.resolve({status,text});}};
window.__fetchDone = raw => {const p=JSON.parse(raw),r=pending.get(p.id);if(r){pending.delete(p.id);r.resolve(p);}};
window.__nativeDone = raw => {const p=JSON.parse(raw),r=pending.get(p.id);if(r){pending.delete(p.id);r.resolve(p.result);}};
// Native transport failures arrive as status 0 with a reason in the body.
const transportFailures={DNS_FAILED:'域名无法解析，或解析结果不是可用的设备地址',TLS_CERT_FAILED:'HTTPS 证书无效或与域名不符，已拒绝连接',TLS_FAILED:'HTTPS 连接失败',DEVICE_ADDRESS_REJECTED:'设备地址不被允许',LOCAL_NETWORK_PERMISSION_DENIED:'本地网络权限未开启，请在系统设置中允许后重试'};
window.__nfetch = async (url,options) => {
  let r;try{r=await nativeCall('f',id=>AndroidCore.fetch(id,url,JSON.stringify(options||{})));}
  catch(e){e.code='NETWORK';throw e;}
  const reason=(r.status===0||r.status===403)&&transportFailures[r.text];
  if(reason)throw Object.assign(Error(reason),{code:'NETWORK'});
  if([502,503,504,520,521,522,523,524,525,526,530].includes(r.status))throw Object.assign(Error('隧道或代理暂时不可用（HTTP '+r.status+'），稍后自动重试'),{code:'NETWORK'});
  return {status:r.status,ok:r.status>=200&&r.status<300,text:async()=>r.text};
};
window.__nevalJS = async js => {
  const code=/^\s*return\b/.test(js)?'(function(){'+js+'})()':js;
  const result=await nativeCall('e',id=>AndroidCore.evalJS(id,code));
  try{return JSON.parse(result);}catch(_){return result;}
};
window.__nloadHTML = html => nativeCall('h',id=>AndroidCore.loadHTML(id,html));
</script>
<script src="network_mode.js"></script><script src="device_address.js"></script><script src="upstream_local.js"></script><script src="air6_api.js"></script><script src="lan_api.js"></script><script src="lan_runtime.js"></script>
</body></html>
